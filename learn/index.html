<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn ML with Garhwali</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--card:#fcfcfb;--line:#e3e2dd;--grid:#ebeae5;--ink:#0b0b0b;--ink2:#52514e;--mute:#8a8985;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--good:#0ca30c;--bad:#d03b3b}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111110;--card:#1a1a19;--line:#33332f;--grid:#2a2a27;--ink:#fff;--ink2:#c3c2b7;--mute:#8f8e86;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111110;--card:#1a1a19;--line:#33332f;--grid:#2a2a27;--ink:#fff;--ink2:#c3c2b7;--mute:#8f8e86;--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

.sub{color:var(--mute);font-size:.92rem}.nav{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}.nav a{font-size:.8rem;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);text-decoration:none;background:var(--card)}.nav a.done{border-color:var(--good);color:var(--good)}

.widget{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}label{font-size:.85rem;color:var(--ink2)}
input[type=range]{width:180px}input[type=text],textarea,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}textarea{width:100%;min-height:60px}
button{font:inherit;padding:7px 12px;border:0;border-radius:8px;background:var(--s1);color:#fff;cursor:pointer}button.g{background:var(--grid);color:var(--ink)}

</style></head><body><div class="wrap">
<h1>Learn machine learning through the Garhwali model</h1>
<div class="sub">From a single number that learns, to the pipeline running on your DGX Spark. Every module: an idea, a thing to play with, the file where it lives in <span class="file">~/garhwali</span>, a quiz. Progress is saved on this device. <a href="../dashboard/">Dashboard</a> · <a href="https://github.com/aptsalt/garhwali-review/blob/master/STUDY_PLAN.md">8-week plan</a></div>
<div class="nav" id="nav"></div>
<div id="mods"></div>
</div>
<script>
const $=s=>document.querySelector(s),LS=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},SS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let live=null;fetch('../dashboard/status.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{live=d;renderLive()}).catch(()=>{});
const M=[];
function mod(o){M.push(o)}
/* ---------- 1. A number that learns ---------- */
mod({id:'neuron',lvl:'Basics 1',title:'A number that learns',
body:`A model is a formula with knobs. The simplest one: <b>ŷ = w·x + b</b>, two knobs. "Learning" means turning the knobs so the formula's guesses ŷ get close to the true answers y. The <b>loss</b> is one number that says how wrong the guesses are (here: mean squared error). Turn the knobs by hand first and watch the loss; then press <em>step</em> and let the gradient do it.`,
widget:`<div class=row><label>w <input type=range id=n_w min=-3 max=3 step=0.05 value=-1></label><label>b <input type=range id=n_b min=-3 max=3 step=0.05 value=2></label><label>learning rate <input type=range id=n_lr min=0.01 max=0.6 step=0.01 value=0.1></label><button onclick="nStep()">step</button><button onclick="nRun()">run 30 steps</button><button class=g onclick="nReset()">reset</button></div><div id=n_svg></div><div>loss = <span class=out id=n_loss></span></div>`,
file:'scripts/train_lora.py → the Trainer does exactly this, for 174 million knobs at once.',
quiz:[['If the loss goes up after a step, the most likely cause is','the learning rate is too big','the data is too small','the model has too many knobs',0,'A too-large step overshoots the bottom of the bowl. Watch it happen with the slider at 0.6.'],['The gradient tells you','which way and how much to turn each knob to reduce loss','how good the model is','how many steps remain',0,'It is the slope of the loss with respect to each knob.']]});
const nData=[[0,0.4],[0.5,1.1],[1,1.6],[1.5,2.2],[2,2.9],[2.5,3.3],[3,4.1]];
function nDraw(){const w=+$('#n_w').value,b=+$('#n_b').value;const L=nData.reduce((a,[x,y])=>a+(w*x+b-y)**2,0)/nData.length;$('#n_loss').textContent=L.toFixed(3);
 const X=x=>40+x*80,Y=y=>170-y*32;let s=`<svg viewBox="0 0 320 190" width=320 height=190><line x1=40 y1=170 x2=300 y2=170 stroke="var(--line)"/><line x1=40 y1=10 x2=40 y2=170 stroke="var(--line)"/>`;
 nData.forEach(([x,y])=>s+=`<circle cx=${X(x)} cy=${Y(y)} r=5 fill="var(--s1)"/>`);s+=`<line x1=${X(0)} y1=${Y(b)} x2=${X(3.2)} y2=${Y(w*3.2+b)} stroke="var(--s2)" stroke-width=2/></svg>`;$('#n_svg').innerHTML=s}
function nStep(){const w=+$('#n_w').value,b=+$('#n_b').value,lr=+$('#n_lr').value;let gw=0,gb=0;nData.forEach(([x,y])=>{const e=w*x+b-y;gw+=2*e*x;gb+=2*e});gw/=nData.length;gb/=nData.length;$('#n_w').value=Math.max(-3,Math.min(3,w-lr*gw));$('#n_b').value=Math.max(-3,Math.min(3,b-lr*gb));nDraw()}
function nRun(){let i=0;const t=setInterval(()=>{nStep();if(++i>=30)clearInterval(t)},60)}function nReset(){$('#n_w').value=-1;$('#n_b').value=2;nDraw()}
/* ---------- 2. Learning rate ---------- */
mod({id:'lr',lvl:'Basics 2',title:'Learning rate: the size of each step',
body:`The loss is a landscape and training walks downhill. The learning rate is the stride. Too small and you never arrive; too big and you bounce out of the valley. Our runs use 2e-4 for LoRA and 3e-5 to 5e-5 for the speech encoder, with a short <b>warm-up</b> and a <b>cosine decay</b> so strides shrink near the end.`,
widget:`<div class=row><label>learning rate <input type=range id=l_lr min=0.02 max=1.05 step=0.01 value=0.3></label><button onclick="lRun()">walk 25 steps</button></div><div id=l_svg></div><div class=sub id=l_note></div>`,
file:'scripts/train_lora.py → learning_rate, warmup_steps, lr_scheduler_type="cosine".',
quiz:[['Cosine decay means','the learning rate shrinks smoothly toward the end of training','the loss is measured with cosines','the model forgets old data',0,'Big strides early to move fast, small strides late to settle into the valley.']]});
function lRun(){const lr=+$('#l_lr').value;let x=2.6,pts=[];for(let i=0;i<25;i++){pts.push(x);x=x-lr*2*x}pts.push(x);const X=v=>160+v*45,Y=v=>170-v*v*18;let s=`<svg viewBox="0 0 320 190" width=320 height=190><path d="${Array.from({length:61},(_,i)=>{const v=-3+i*0.1;return (i?'L':'M')+X(v)+' '+Y(v)}).join(' ')}" fill=none stroke="var(--line)" stroke-width=2/>`;
 pts.forEach((v,i)=>{if(Math.abs(v)<4)s+=`<circle cx=${X(v)} cy=${Y(v)} r=4 fill="${i==pts.length-1?'var(--s2)':'var(--s1)'}" opacity=${0.3+0.7*i/pts.length}/>`});s+='</svg>';$('#l_svg').innerHTML=s;$('#l_note').textContent=Math.abs(x)>3?'Diverged: the stride is bigger than the valley.':Math.abs(x)>0.05?`Still ${Math.abs(x).toFixed(2)} from the bottom after 25 steps: too slow.`:'Converged.'}
/* ---------- 3. Epochs, steps, batches ---------- */
mod({id:'epoch',lvl:'Basics 3',title:'Epochs, steps and batches',
body:`The data is cut into <b>batches</b>; one <b>step</b> updates the knobs from one batch; one <b>epoch</b> is a full pass over all the data. Our ASR round 3 has 17,049 clips in batches of 8, so 2,132 steps per epoch. The language-model runs pack text into 1,024-token sequences, 16 per step, so "step 530 of 2,179" means 530 batches of about 16,000 tokens. <b>Overfitting</b> is when the model keeps getting better on the training batches but worse on data it has never seen; that is why we score a held-out test set after every epoch and keep the best checkpoint, not the last.`,
widget:`<div class=row><label>clips <input type=range id=e_n min=1000 max=120000 step=1000 value=17049></label><label>batch <select id=e_b><option>4</option><option selected>8</option><option>16</option><option>32</option></select></label><label>s/step <input type=range id=e_s min=1 max=40 step=0.5 value=4.5></label></div><div>steps per epoch: <span class=out id=e_out></span> · hours per epoch on this box: <span class=out id=e_h></span></div><div class=sub>This is the calculation that turned a 96,000-clip plan (days) into a 17,049-clip plan (hours) on 24 Sept.</div><div id=e_svg></div>`,
file:'runs/asr-mms-gbm-r*/log.tsv → WER per epoch; round 1 got worse at epoch 3 = overfitting.',
quiz:[['We keep the checkpoint with the best test-set score, not the last one, because','the last epoch may have started overfitting','the last one is corrupted','checkpoints are random',0,'Round 1: 0.711 at epoch 2, 0.722 at epoch 3.'],['Doubling the batch size with the same data','halves the steps per epoch','halves the epochs','doubles the learning rate',0,'Steps per epoch = clips ÷ batch size.']]});
function eCalc(){const n=+$('#e_n').value,b=+$('#e_b').value,s=+$('#e_s').value;const st=Math.ceil(n/b);$('#e_out').textContent=st.toLocaleString();$('#e_h').textContent=(st*s/3600).toFixed(1);
 const tr=[0.75,0.62,0.55,0.50,0.46,0.43,0.41,0.39],te=[0.75,0.61,0.56,0.53,0.513,0.515,0.52,0.53];const X=i=>40+i*36,Y=v=>170-(v-0.35)*330;let g=`<svg viewBox="0 0 320 190" width=320 height=190><text x=6 y=14 font-size=11 fill="var(--mute)">WER by epoch: training (orange) vs held-out test (blue)</text>`;
 [[tr,'var(--s2)'],[te,'var(--s1)']].forEach(([a,c])=>{g+=`<path d="${a.map((v,i)=>(i?'L':'M')+X(i)+' '+Y(v)).join(' ')}" fill=none stroke="${c}" stroke-width=2/>`;a.forEach((v,i)=>g+=`<circle cx=${X(i)} cy=${Y(v)} r=3.5 fill="${c}"/>`)});g+=`<text x=${X(4)-10} y=${Y(0.513)-8} font-size=11 fill="var(--ink2)">best: keep this one</text></svg>`;$('#e_svg').innerHTML=g}
/* ---------- 4. Tokens ---------- */
mod({id:'tok',lvl:'Language models 1',title:'Tokens: what the model actually reads',
body:`Models do not read letters or words; they read <b>tokens</b>, pieces from a fixed vocabulary learned by merging frequent character pairs (byte-pair encoding). A tokenizer trained mostly on English cuts Devanagari into tiny fragments, so every Garhwali sentence costs more tokens, more time and more memory. We measured it: the same Garhwali corpus is <b>7.8 million tokens for Qwen and 4.4 million for Sarvam-M</b>, because Sarvam's vocabulary was built on Indian languages. Type something and watch a toy merge-based tokenizer work.`,
widget:`<textarea id=t_in>सिंगापुर मजी रण की खातिर एक भौत सुरक्षित जगह छा।</textarea><div class=row><button onclick="tok()">tokenise</button><label>vocabulary size <select id=t_v onchange="tok()"><option value=40>small (English-centric)</option><option value=120 selected>large (Indic-aware)</option></select></label></div><div id=t_out style="margin-top:8px;line-height:2.2"></div><div class=sub id=t_n></div>`,
file:'"packed into N sequences (T tokens total)" in every run log; AutoTokenizer in scripts/train_lora.py.',
quiz:[['A tokenizer that splits Garhwali into more pieces makes training','slower and more expensive per sentence','more accurate','impossible',0,'Cost scales with tokens; Sarvam reads the same text with 43% fewer.']]});
function tok(){const s=$('#t_in').value,V=+$('#t_v').value;const isDev=c=>/[ऀ-ॿ]/.test(c);const words=s.split(/(\s+)/);let toks=[];words.forEach(w=>{if(!w.trim()){return}if(/^[ऀ-ॿ]+$/.test(w)){const step=V>=120?(w.length>6?3:w.length):1;for(let i=0;i<w.length;i+=step)toks.push(w.slice(i,i+step))}else{const step=V>=120?4:3;for(let i=0;i<w.length;i+=step)toks.push(w.slice(i,i+step))}});const cols=['var(--s1)','var(--s2)','var(--s3)','var(--s4)'];$('#t_out').innerHTML=toks.map((t,i)=>`<span style="border:1px solid ${cols[i%4]};border-radius:6px;padding:2px 5px;margin:2px">${t}</span>`).join('');$('#t_n').textContent=`${toks.length} tokens for ${s.trim().split(/\s+/).length} words (toy tokenizer; real ones are learned, but the effect is the same).`}
/* ---------- 5. Attention ---------- */
mod({id:'attn',lvl:'Language models 2',title:'Attention: each word looks at the others',
body:`A transformer builds the meaning of each token by mixing in the other tokens, weighted by how relevant they are. The weights come from a <b>softmax</b> over similarity scores, so they are positive and sum to one. Drag the scores and watch the weights: raising one lowers the rest, and one large score wins almost everything. In the model, the scores are learned dot products between a "query" and each "key"; this happens in every layer, for every token, which is why long inputs cost more.`,
widget:`<div id=a_ctrl></div><div id=a_svg></div>`,
file:'attn_implementation="sdpa" in scripts/train_lora.py; the KV cache that eval_translate.py fills during generation is these keys and values, stored so they are not recomputed per token.',
quiz:[['Softmax guarantees the attention weights','are positive and add up to one','are all equal','are integers',0,'Exponentiate each score, divide by the sum.']]});
const aW=['यख','नेविगेट','करी','सकदन'];let aS=[1.2,2.4,0.4,0.9];
function aDraw(){const e=aS.map(v=>Math.exp(v)),z=e.reduce((a,b)=>a+b,0),p=e.map(v=>v/z);$('#a_ctrl').innerHTML=aW.map((w,i)=>`<label style="display:inline-block;margin:4px 10px 4px 0">${w} score <input type=range min=-2 max=4 step=0.1 value=${aS[i]} oninput="aS[${i}]=+this.value;aDraw()"></label>`).join('');
 $('#a_svg').innerHTML=`<svg viewBox="0 0 400 120" width=400 height=120>${p.map((v,i)=>`<rect x=${20+i*95} y=${100-v*90} width=70 height=${v*90} rx=4 fill="var(--s1)"/><text x=${55+i*95} y=112 font-size=11 text-anchor=middle fill="var(--ink2)">${aW[i]} ${(v*100).toFixed(0)}%</text>`).join('')}</svg>`}
/* ---------- 6. Memory-bound decoding ---------- */
mod({id:'bw',lvl:'Inference 1',title:'Why generating text is limited by memory speed, not maths',
body:`To produce one token, the GPU must read <em>every</em> weight of the model once. So the ceiling on tokens per second for one request is <b>memory bandwidth ÷ model size in bytes</b>. The DGX Spark has 128 GB of memory but only 273 GB/s of bandwidth; an RTX 4090 has 16 GB but about 1,000 GB/s; an H100 about 3,350 GB/s. This one formula explains our whole schedule: why an 8B model on this box decodes at roughly 17 tokens/s in bf16, why 4-bit quantisation makes it 4× faster, and why batching many requests together is the trick that recovers throughput.`,
widget:`<div class=row><label>parameters (B) <input type=text id=b_p value=8 size=4></label><label>bits per weight <select id=b_b><option>16</option><option>8</option><option selected>16</option><option>4</option></select></label><label>bandwidth GB/s <select id=b_w><option value=273 selected>DGX Spark 273</option><option value=1008>RTX 4090 1008</option><option value=3350>H100 3350</option><option value=8000>B200 8000</option></select></label><button onclick="bw()">compute</button></div><div>model bytes: <span class=out id=b_gb></span> GB · ceiling ≈ <span class=out id=b_t></span> tokens/s for one request · batch of 16 ≈ <span class=out id=b_t16></span> tokens/s total</div><div class=sub>Measured on this box: a 1-second eval batch reads 16 GB of Qwen3-8B weights per token. Our evals of 1,012 sentences took 20 to 60 minutes per direction for exactly this reason.</div>`,
file:'~/bench-gb10 (your own benchmark), eval_translate.py timings, RESEARCH.md hardware note.',
quiz:[['Quantising a model from 16-bit to 4-bit weights makes single-request decoding roughly','4× faster','4× slower','unchanged',0,'Four times fewer bytes to read per token.'],['Batching 16 requests helps because','the same weight read serves 16 tokens','the model gets smaller','the GPU has more memory',0,'Throughput goes up, per-request latency barely changes.']]});
function bw(){const p=+$('#b_p').value,b=+$('#b_b').value,w=+$('#b_w').value;const gb=p*b/8;$('#b_gb').textContent=gb.toFixed(1);$('#b_t').textContent=(w/gb).toFixed(0);$('#b_t16').textContent=(w/gb*16*0.85).toFixed(0)}
/* ---------- 7. LoRA ---------- */
mod({id:'lora',lvl:'Fine-tuning 1',title:'LoRA: teach a big model with a small add-on',
body:`Fine-tuning all 8 billion weights needs memory for gradients and optimizer state for each of them, three to four times the model size. <b>LoRA</b> freezes the model and adds two thin matrices, A (d×r) and B (r×d), next to each weight matrix; only those train. With rank r = 32 on Qwen3-8B that is 174 million trainable numbers, 2% of the model, saved as a 300 MB adapter you can share. <b>QLoRA</b> additionally stores the frozen model in 4 bits so it fits a 16 GB card.`,
widget:`<div class=row><label>hidden size d <select id=r_d><option>4096</option><option selected>4096</option><option>5120</option></select></label><label>rank r <input type=range id=r_r min=4 max=256 step=4 value=32 oninput="lora()"></label><label>matrices adapted <input type=range id=r_m min=1 max=7 value=7 oninput="lora()"></label></div><div>per layer: full weights ≈ <span class=out id=r_full></span> M · LoRA params ≈ <span class=out id=r_lora></span> M (<span class=out id=r_pct></span>%)</div><div id=r_svg></div>`,
file:'get_peft_model(LoraConfig(r=32, lora_alpha=64, target_modules=[q,k,v,o,gate,up,down])) in scripts/train_lora.py; adapters in runs/*/adapter.',
quiz:[['LoRA parameters grow','linearly with the rank r','with the square of d','with the number of tokens',0,'2·d·r per matrix; doubling r doubles the adapter.']]});
function lora(){const d=+$('#r_d').value,r=+$('#r_r').value,m=+$('#r_m').value;const full=d*d*m/1e6,lo=2*d*r*m/1e6;$('#r_full').textContent=full.toFixed(0);$('#r_lora').textContent=lo.toFixed(2);$('#r_pct').textContent=(100*lo/full).toFixed(2);
 $('#r_svg').innerHTML=`<svg viewBox="0 0 360 130" width=360 height=130><rect x=10 y=10 width=100 height=100 fill="var(--grid)" stroke="var(--line)"/><text x=60 y=65 text-anchor=middle font-size=11 fill="var(--mute)">W (d×d) frozen</text><text x=140 y=65 font-size=20 fill="var(--ink2)">+</text><rect x=175 y=10 width=100 height=${Math.max(4,r/2.56)} fill="var(--s2)"/><text x=225 y=${Math.max(4,r/2.56)+24} text-anchor=middle font-size=11 fill="var(--ink2)">A (r×d)</text><rect x=300 y=10 width=${Math.max(4,r/2.56)} height=100 fill="var(--s1)"/><text x=${310+r/2.56} y=65 font-size=11 fill="var(--ink2)">B</text></svg>`}
/* ---------- 8. Evaluation ---------- */
mod({id:'eval',lvl:'Evaluation',title:'chrF and WER: how we know the needle moved',
body:`Never trust a model's own opinion of itself. We hold out 1,012 professionally translated sentences (FLORES) that no training run ever sees, and score every model on them. <b>chrF++</b> counts overlapping character n-grams between the model's output and the reference, which is kind to a language with unsettled spelling. <b>WER</b> for speech is the fraction of words that must be inserted, deleted or substituted to turn the transcript into the truth. Edit both boxes and watch the numbers; then guess why "more of the same text" moved chrF++ by 0.1 on 24 Sept.`,
widget:`<div class=row><div style="flex:1 1 260px"><label>reference</label><textarea id=v_ref>सिंगापुर आमतौर पर रणा का खातिर एक बेहद सुरक्षित जगह छ अर यख नेविगेट कनु सरल छन</textarea></div><div style="flex:1 1 260px"><label>model output</label><textarea id=v_hyp>सिंगापुर मजी रण की खातिर आम तौर पर एक भौत सुरक्षित जगह छा आप यख आसानी सी नेविगेट करी सकदन</textarea></div></div><div class=row><button onclick="ev()">score</button><span>character-2-gram F (chrF-like): <span class=out id=v_chrf></span> · WER: <span class=out id=v_wer></span></span></div><div class=sub>Real chrF++ uses character 1–6-grams plus word 1–2-grams; the idea is the same.</div>`,
file:'scripts/eval_translate.py (sacrebleu), eval/flores_test.jsonl, eval/results/scores.tsv.',
quiz:[['A held-out test set must never be used for training because','the score would no longer predict performance on new text','it is too small','it is copyrighted',0,'Training on the test is memorising the exam.'],['On 24 Sept the full run (20M tokens) scored the same as the pilot (7.8M). The lesson was','more of the same kind of text is not the lever; variety, spelling consistency, base model and reviewed gold are','the model is broken','the test set is wrong',0,'Confirmed a day later when Sarvam-M, a different base, added 15 points on English→Garhwali.']]});
function ng(s,n){const a={};s=s.replace(/\s+/g,' ');for(let i=0;i+n<=s.length;i++){const k=s.slice(i,i+n);a[k]=(a[k]||0)+1}return a}
function ev(){const r=$('#v_ref').value.trim(),h=$('#v_hyp').value.trim();let f=[];for(const n of [1,2,3,4]){const A=ng(r,n),B=ng(h,n);let m=0,ta=0,tb=0;for(const k in B){tb+=B[k];if(A[k])m+=Math.min(A[k],B[k])}for(const k in A)ta+=A[k];const p=tb?m/tb:0,rc=ta?m/ta:0;f.push(p+rc?(1+4)*p*rc/(4*p+rc):0)}$('#v_chrf').textContent=(100*f.reduce((a,b)=>a+b,0)/f.length).toFixed(1);
 const R=r.split(/\s+/),H=h.split(/\s+/);const D=Array.from({length:R.length+1},(_,i)=>Array.from({length:H.length+1},(_,j)=>i&&j?0:i||j));for(let i=1;i<=R.length;i++)for(let j=1;j<=H.length;j++)D[i][j]=Math.min(D[i-1][j]+1,D[i][j-1]+1,D[i-1][j-1]+(R[i-1]===H[j-1]?0:1));$('#v_wer').textContent=(D[R.length][H.length]/R.length).toFixed(3)}
/* ---------- 9. CTC ---------- */
mod({id:'ctc',lvl:'Speech 1',title:'CTC: turning 50 audio frames a second into letters',
body:`The speech model looks at audio in short frames, about 50 per second, and for each frame outputs a letter or a special <b>blank</b>. The word is recovered by collapsing repeats and dropping blanks, so the model never needs to know exactly where each letter starts. The loss (CTC) sums over every alignment that collapses to the right text. The "confidence" we use to filter pseudo-labels is the average probability of the chosen letter per frame.`,
widget:`<div class=row><label>frames <input type=text id=c_in value="प प _ _ ा ा _ ण ण _ _ ि" size=40></label><button onclick="ctc()">collapse</button></div><div>result: <span class=out id=c_out></span></div>`,
file:'Wav2Vec2ForCTC, proc.batch_decode(argmax) in scripts/asr_finetune.py and asr_transcribe.py; conf field in audio/*_asr.jsonl.',
quiz:[['CTC lets the model skip labelling exact letter boundaries because','it sums over all alignments that collapse to the same text','it uses a dictionary','audio has no boundaries',0,'Repeats merge, blanks vanish.']]});
function ctc(){const f=$('#c_in').value.trim().split(/\s+/);let out='',prev=null;for(const t of f){if(t!==prev&&t!=='_')out+=t;prev=t}$('#c_out').textContent=out}
/* ---------- 10. Self-training ---------- */
mod({id:'pseudo',lvl:'Speech 2',title:'Self-training: the model labels audio for its own next round',
body:`We have 15 hours of human-transcribed Garhwali and 135 hours without transcripts. The trained model transcribes the 135 hours, we keep only the segments where it was confident, retrain on gold plus those, and repeat. The gate matters: too loose and the model learns its own mistakes; too strict and there is nothing to learn from. Slide the gate over our real confidence distribution from 24 Sept.`,
widget:`<div class=row><label>confidence gate <input type=range id=p_g min=0.5 max=0.98 step=0.01 value=0.9 oninput="pseudo()"></label></div><div>utterances kept: <span class=out id=p_n></span> of 110,410 · hours ≈ <span class=out id=p_h></span></div><div id=p_svg></div>`,
file:'asr_transcribe.py --parquet, asr_finetune.py --pseudo --pseudo_conf --pseudo_max; jobs/queue.jsonl job asr-r3.',
quiz:[['We capped round 3 at the 10,000 most confident pseudo-labels because','96,000 utterances would take days and the low-confidence ones reinforce errors','the disk was full','10,000 is a rule',0,'Quality first, then volume as the model improves.']]});
function pseudo(){const g=+$('#p_g').value;const pts=[[0.5,110410],[0.6,106000],[0.7,99000],[0.74,95000],[0.8,89173],[0.84,62000],[0.9,35759],[0.95,5491],[0.98,600]];let n=0;for(let i=0;i<pts.length-1;i++){if(g>=pts[i][0]&&g<=pts[i+1][0]){const t=(g-pts[i][0])/(pts[i+1][0]-pts[i][0]);n=pts[i][1]+(pts[i+1][1]-pts[i][1])*t}}if(g<pts[0][0])n=pts[0][1];$('#p_n').textContent=Math.round(n).toLocaleString();$('#p_h').textContent=(n*4.4/3600).toFixed(0);
 const X=v=>20+(v-0.5)*600,Y=v=>110-v/110410*95;$('#p_svg').innerHTML=`<svg viewBox="0 0 320 125" width=320 height=125><path d="${pts.map((p,i)=>(i?'L':'M')+X(p[0])+' '+Y(p[1])).join(' ')}" fill=none stroke="var(--s1)" stroke-width=2/><line x1=${X(g)} x2=${X(g)} y1=10 y2=110 stroke="var(--s2)" stroke-dasharray="3 3"/><text x=20 y=122 font-size=10 fill="var(--mute)">0.5</text><text x=300 y=122 font-size=10 fill="var(--mute)">1.0</text></svg>`}
/* ---------- 11. Data is the lever ---------- */
mod({id:'data',lvl:'Data',title:'Where the words come from, and why variety beats volume',
body:`Garhwali has no big web corpus. We built 2.71 million words from 27 sources plus 80 hours of radio bulletins transcribed by our own ASR, then found that doubling the same kind of text did not move the score. What moves it: <b>a better base model</b> (Sarvam-M), <b>back-translation</b> (translate our monolingual Garhwali into Hindi and English, then train in reverse so the model's output side is always human-written Garhwali), <b>a spelling standard</b>, and <b>reviewed gold</b> from your parents.`,
widget:`<div id=d_live class=sub>loading live corpus numbers…</div>`,
file:'RESEARCH.md, SOURCES.md, ORTHOGRAPHY.md, scripts/backtranslate.py, review/.',
quiz:[['Back-translation helps because','the model learns to write from human-written Garhwali, with machine text only on the input side','it doubles the test set','it needs no GPU',0,'Errors on the input side are tolerable; errors on the output side are copied.']]});
/* ---------- 12. The pipeline ---------- */
mod({id:'pipe',lvl:'Project',title:'The pipeline, end to end',
body:`<ol><li><b>Collect</b>: scrapers and audio ingest (<span class=file>scripts/census.py</span>, <span class=file>ingest_youtube.py</span>).</li><li><b>Clean</b>: language ID, spelling normalisation, dedup (<span class=file>lid.py</span>, <span class=file>orthography.py</span>, <span class=file>clean_text.py</span>).</li><li><b>Transcribe</b>: ASR rounds and confidence gates (<span class=file>asr_finetune.py</span>, <span class=file>asr_transcribe.py</span>).</li><li><b>Train</b>: LoRA on a Hindi-strong base (<span class=file>train_lora.py</span>).</li><li><b>Score</b>: gold set, both directions (<span class=file>eval_translate.py</span>).</li><li><b>Serve</b>: speech in, speech out (<span class=file>s2s.py</span>).</li><li><b>Loop</b>: the controller runs the queue and writes the journal (<span class=file>controller.py</span>, <span class=file>RUNBOOK.md</span>).</li></ol>`,
widget:`<div id=pi_live class=sub>loading…</div>`,
file:'RUNBOOK.md is the map; the dashboard is the instrument panel.',
quiz:[['One job at a time on the GPU because','the box is bandwidth-bound, so two jobs each run at half speed and gain nothing','the software forbids it','it saves power',0,'Measured on 24 Sept: 31 s/step alone, 71 s/step shared.']]});

/* ---------- 13. What the data taught us ---------- */
mod({id:'lesson1',lvl:'Project lessons 1',title:'Why 2.5× more text moved the score by 0.1',
body:`On 24 Sept the full run read 20 million tokens, 2.5 times the pilot, and scored 43.6 against the pilot's 43.5 on Hindi→Garhwali. Same base model, same recipe, more of the same text. The lesson is the most important one in the project: <b>a model's output quality is bounded by the variety and cleanliness of what it reads, not the amount</b>. Blog posts and Bible verses teach the same words again; they do not teach the words the test set needs. Everything after that day changed <em>what</em> the model reads: a base model that already knows Indian languages, sentences whose Garhwali side is human-written, dictionaries for the words it keeps missing, and your corrections. <br><br><b>Where:</b> <span class=file>eval/results/scores.tsv</span> rows qwen3-8b-pilot vs qwen3-8b-full; journal entry 24 Sept 05:00.`,
widget:`<div class=widget style="margin:0"><table><tr><th>run</th><th>tokens</th><th>Hindi→Garhwali chrF++</th></tr><tr><td>pilot</td><td class=n>7.8 M</td><td class=n>43.5</td></tr><tr><td>full</td><td class=n>20 M</td><td class=n>43.6</td></tr><tr><td>v2 (bidirectional, bulletins)</td><td class=n>33 M</td><td class=n>43.3</td></tr><tr><td>Sarvam-M pilot (new base)</td><td class=n>4.4 M</td><td class=n>44.3</td></tr></table></div>`,
file:'scripts/train_lora.py is identical across these runs; only --model and the data files differ.',
quiz:[['The cheapest thing that moved the score in that table was','changing the base model','adding tokens','training longer',0,'Sarvam-M on a third of the tokens beat every Qwen run.']]});
/* ---------- 14. Back-translation ---------- */
mod({id:'bt',lvl:'Project lessons 2',title:'Back-translation: make the model write from human Garhwali',
body:`We have 2.7 million words of Garhwali written by people but only 27,000 sentence pairs with a Hindi side. Back-translation turns the monolingual text into pairs: the v2 model, which is good at Garhwali→Hindi (49.9) and Garhwali→English (58.9), translates each Garhwali paragraph <em>out</em>; we then train the next model <em>in</em>, from that machine Hindi to the human Garhwali. Errors sit on the input side, where they are tolerable; the output side, the part the model imitates, is always real. On 26 Sept we generated 40,000 such pairs from 20,000 paragraphs; 60,000 was planned but generation ran at 0.6 paragraphs a second on this box.<br><br><b>Where:</b> <span class=file>scripts/backtranslate.py</span>, output <span class=file>data/bt_pairs.jsonl</span>, merged in <span class=file>data/sft_train_v3.jsonl</span>.`,
widget:`<div class=row><label>paragraphs <input type=range id=bt_n min=1000 max=160000 step=1000 value=20000 oninput="btc()"></label><label>paragraphs/s <input type=range id=bt_r min=0.2 max=20 step=0.2 value=0.6 oninput="btc()"></label></div><div>pairs: <span class=out id=bt_p></span> · hours: <span class=out id=bt_h></span></div><div class=sub>Move the rate to 10/s to see what a rented H100 does to this step.</div>`,
file:'jobs/queue.jsonl job bt-gen; the 60k→20k decision is in the journal.',
quiz:[['In back-translation the human-written text is on the','output (target) side','input (source) side','both sides',0,'The model copies what it is trained to produce, so that side must be real.']]});
function btc(){const n=+$('#bt_n').value,r=+$('#bt_r').value;$('#bt_p').textContent=(2*n).toLocaleString();$('#bt_h').textContent=(n/r/3600).toFixed(1)}
/* ---------- 15. Spelling standard + dictionaries ---------- */
mod({id:'ortho',lvl:'Project lessons 3',title:'One spelling, and where the words come from',
body:`Garhwali writers spell the same word several ways: the corpus has च 24,577 times and छ 3,292 times for "is", नी 5,918 and नि 21,413 for "not". A model trained on all of them splits its knowledge and writes inconsistently, and the speech recogniser is marked wrong for a legitimate variant. There is no official standard, so on 23 Sept we adopted the written consensus in Uttarakhand Open University's Garhwali grammar course (Srinagar dialect base, छ/छन copula, ळ where the lexicon has it, nukta in native words, short final -ि, masculine -ो) and closed its open choices. A normaliser built from those rules plus corpus evidence changes 3.6% of tokens and protects pronouns and Hindi loanwords. Dictionaries then do two jobs: word-level translation pairs aimed at the wrong-word errors, and a reference lexicon for the normaliser. On 26 Sept the lexicon reached 12,736 records from Grierson's 1916 survey, Kukreti's teaching series, glossaries and two scanned books queued for OCR.<br><br><b>Where:</b> <span class=file>ORTHOGRAPHY.md</span>, <span class=file>scripts/orthography.py</span> → <span class=file>data/ortho_map.json</span>, <span class=file>scripts/fetch_lexicon.py</span> → <span class=file>data/lexicon_web.jsonl</span>, <span class=file>scripts/build_data_v4.py</span>.`,
widget:`<div class=row><input type=text id=or_in value="मेरी ब्वे च अर मी घौर मां छौं, दगड़ी बट्टी नी आयी" size=48><button onclick="orn()">normalise</button></div><div id=or_out style="margin-top:8px;font-size:1.1rem"></div><div class=sub>Toy version of the real map: copula च→छ, नी→नि, मां→मा, बट्टी→बटि, दगड़ी→दगड़ि, मी→मि.</div>`,
file:'Rule 5 in ORTHOGRAPHY.md explains why च→छ is a spelling convention, not a claim about speech.',
quiz:[['The normaliser leaves pronouns and Hindi loanwords alone because','a vowel rule would turn तु (you) into तो (then)','they are rare','they are already correct',0,'Short words carry meaning in their vowels; the rule only fires on longer native words.']]});
function orn(){const m={'च':'छ','नी':'नि','मां':'मा','बट्टी':'बटि','दगड़ी':'दगड़ि','मी':'मि','घौर':'घौर'};$('#or_out').innerHTML=$('#or_in').value.split(/(\s+)/).map(w=>m[w]&&m[w]!==w?`<b style="color:var(--s2)">${m[w]}</b>`:w).join('')}
/* ---------- 16. Self-training result ---------- */
mod({id:'st',lvl:'Project lessons 4',title:'What self-training actually did',
body:`Round 3 trained the recogniser on 7,049 gold clips plus the 10,000 most confident of 110,410 machine-labelled Vaani clips. Epoch 1 got <em>worse</em> (0.523 vs 0.513) and epoch 2 recovered to a new best, 0.503: one point for ten thousand pseudo-labels, and only once the learning rate had decayed. Then your 19 corrected radio clips gave a second test set, and there round 3 scored 0.342 against round 2's 0.222: the field-speech pseudo-labels pulled the model toward the Vaani style. One caveat: your corrections were edited from round 2's output, which favours round 2, so the review page will next show round 3's transcripts to balance it. The lesson: pseudo-labels help a little, in-domain human labels help a lot, and every test set answers a different question.<br><br><b>Where:</b> <span class=file>runs/asr-mms-gbm-r3/log.tsv</span>, <span class=file>scripts/asr_eval_gold.py</span>, <span class=file>eval/results/asr_scores.tsv</span>.`,
widget:`<div class=widget style="margin:0"><table><tr><th>model</th><th>field speech (Vaani test)</th><th>radio (your 19 clips)</th></tr><tr><td>untouched adapter</td><td class=n>0.746</td><td class=n>–</td></tr><tr><td>round 2, gold only</td><td class=n>0.513</td><td class=n>0.222</td></tr><tr><td>round 3, + pseudo-labels</td><td class=n>0.503</td><td class=n>0.342</td></tr></table></div>`,
file:'Round 4 (queued) starts from round 2 and adds your clips at five times weight: scripts/asr_finetune.py --review.',
quiz:[['Round 3 won on field speech and lost on radio. The right conclusion is','the pseudo-labels shifted the model toward the field-speech domain; use in-domain human labels','round 3 is broken','the radio test is wrong',0,'Different test sets, different questions.']]});
/* ---------- 17. The controller and its two failures ---------- */
mod({id:'ctl',lvl:'Project lessons 5',title:'A pipeline that runs itself, and what broke',
body:`Since 25 Sept a cron job runs the controller every ten minutes: it executes a queue of jobs one at a time on the GPU, checks each job's outputs, writes a journal entry and pushes the dashboard. Two faults appeared within a day and both are instructive. <b>Fault 1:</b> a job I killed to change a setting had already written a partial output file, so the controller counted it as finished and launched the next two jobs on incomplete data. Fix: a job is done only if its exit code is 0 <em>and</em> its outputs exist. <b>Fault 2:</b> the local 8-billion-parameter model that wrote journal notes invented numbers that appeared nowhere in the logs. Fix: every number in a note is checked against the log lines; a note that fails is replaced by a template; the model is now off by default. <b>Fault 3</b>, the morning after: three things resident at once (demo server 22 GB, local model 22 GB, a 24B training run) ran the box out of memory and the run was killed while loading. Rule: nothing else lives on the box during a big run.<br><br><b>Where:</b> <span class=file>scripts/controller.py</span>, <span class=file>jobs/queue.jsonl</span>, <span class=file>jobs/state.json</span>, <span class=file>RUNBOOK.md</span>.`,
widget:`<div id=ctl_live class=sub>loading queue…</div>`,
file:'Every job in the queue table on the dashboard is one line in jobs/queue.jsonl.',
quiz:[['A small local model is safe to use for','writing summaries that are checked against the source numbers','deciding which training job runs next','nothing',0,'Judgment over expensive actions stays deterministic; language tasks with verification are fine.']]});

/* ---------- 18. Tokenizers ---------- */
mod({id:`tok2`,lvl:`Decisions 1`,title:`Tokenizers: which one reads Garhwali best`,
body:`A model never sees letters or words. It sees <b>tokens</b>, pieces cut by its tokenizer, and every token costs compute, memory and context. So the first question for a new language is: how many tokens does each Garhwali word become? That number is called <b>fertility</b> (tokens per word). Lower is better: training is cheaper, generation is faster, and more text fits in the context window.<br><br><b>The options.</b> (1) Use the base model's own tokenizer as it is. (2) Train a new Garhwali tokenizer and <em>extend</em> the model's vocabulary with it. (3) Train a whole new model with a new tokenizer. A new tokenizer is not a plug-in: the model has learned one embedding vector per token of <em>its</em> vocabulary, so new tokens start with meaningless embeddings that must be learned from data. With 3 to 4 million words of Garhwali, that learning is thin, and papers on vocabulary extension for low-resource languages usually report faster inference but equal or lower quality.<br><br><b>What we measured</b> on the 1,012 FLORES Garhwali test sentences (real Garhwali, not mixed text). Sarvam-M's tokenizer, built with Indian languages in mind, needs 2.34 tokens per word; Qwen3 needs 4.91, more than twice as many. On English both need about 1.27. The public <em>gbm-tokenizer</em> (128K SentencePiece unigram) reports 2.11, but on a 238-line test file of mixed English, code and maths, where Gemma 3 scored 1.84. Its file is gated and its corpus is unreleased.<br><br><b>Decision:</b> keep each model's own tokenizer. Sarvam is already within about 10% of a dedicated Garhwali tokenizer, which is part of why it became our into-Garhwali model: it packs the same text into 1.8× fewer tokens than Qwen, so each training step sees more Garhwali. A Garhwali vocabulary extension could still help Qwen one day; it is a research project, not a quick win.`,
widget:`<table><tr><th>tokenizer</th><th>Garhwali tokens/word</th><th>English tokens/word</th><th>measured on</th></tr><tr><td>Sarvam-M (Mistral-based, SentencePiece)</td><td class=n>2.34</td><td class=n>1.27</td><td>FLORES gbm test, 1,012 sentences</td></tr><tr><td>Qwen3-8B (byte-level BPE)</td><td class=n>4.91</td><td class=n>1.26</td><td>FLORES gbm test</td></tr><tr><td>gbm-tokenizer (somu9, 128K unigram)</td><td class=n>2.11</td><td class=n>–</td><td>its own 238-line mixed eval</td></tr><tr><td>Gemma 3 (same 238-line eval)</td><td class=n>1.84</td><td class=n>–</td><td>its own 238-line mixed eval</td></tr></table>`,
file:`fertility check: a few lines of transformers AutoTokenizer over eval/flores_test.jsonl; the corpus side is data/cpt_train_v3.jsonl.`,
quiz:[[`Why can't you simply swap in a better Garhwali tokenizer for an existing model?`,`the model's embeddings belong to its own vocabulary; new tokens start untrained`,`tokenizers are copyrighted`,`the GPU cannot load two tokenizers`,0,`Each token id indexes a learned embedding row. New ids need new rows, learned from lots of text.`],[`Two tokenizers are compared on different test files. What can you conclude?`,`almost nothing: fertility depends heavily on the text measured`,`the lower number wins`,`the bigger vocabulary wins`,0,`Always measure on the same, representative text.`]]});

/* ---------- 19. Base model ---------- */
mod({id:`base`,lvl:`Decisions 2`,title:`Choosing the base model: Sarvam for into-Garhwali, Qwen for out of it`,
body:`We cannot train a Garhwali model from scratch: good models need hundreds of billions of tokens and all public Garhwali is a few million words. So we <b>fine-tune</b> an existing multilingual model that already knows Hindi, and teach it the differences.<br><br><b>Options considered.</b> Qwen3-8B (strong multilingual, 8B, fits easily). Sarvam-M (24B, Mistral-based, Indian-language focus). Gemma 3 12B (good, licence acceptance needed). NLLB-200 and IndicTrans2 (translation specialists, but no Garhwali and small context). mT5-small (what one public Garhwali model uses; tiny, 300M).<br><br><b>The test that decided it:</b> the <em>same</em> pilot data on Qwen3-8B and on Sarvam-M. Into Garhwali from English, Sarvam scored 50.8 chrF++ against Qwen's 35.7: a 15-point gap from the base model alone, which is larger than any data change we ever made. From Hindi they were close (44.3 vs 43.5). Out of Garhwali, Qwen v2 is our best (58.9 into English, 49.9 into Hindi).<br><br><b>Decision:</b> Sarvam-M for translation into Garhwali, Qwen3-8B v2 for translation out of Garhwali. The price: Sarvam is 24B, so a training step takes 60-72 s instead of 32-43 s, and it needs most of the box's memory, which is why the live demo had to stop for v5 training.`,
widget:`<table><tr><th>same pilot data</th><th>hin→gbm</th><th>eng→gbm</th></tr><tr><td>Qwen3-8B zero-shot (no training)</td><td class=n>33.8</td><td class=n>28.4</td></tr><tr><td>Qwen3-8B pilot LoRA</td><td class=n>43.5</td><td class=n>35.7</td></tr><tr><td>Sarvam-M zero-shot (300 sentences)</td><td class=n>28.7</td><td class=n>31.8</td></tr><tr><td>Sarvam-M pilot LoRA</td><td class=n>44.3</td><td class=n>50.8</td></tr></table>`,
file:`eval/results/scores.tsv; runs/qwen3-8b-pilot, runs/sarvam-pilot; scripts/train_lora.py --model.`,
quiz:[[`The biggest single jump in English→Garhwali came from`,`changing the base model`,`adding 2.5× more text`,`back-translation`,0,`Same data, different base: 35.7 → 50.8.`],[`Why not use NLLB-200 or IndicTrans2?`,`they don't include Garhwali and would need the language taught from zero`,`they are closed source`,`they only translate into English`,0,`Both are open, but gbm is not among their languages.`]]});

/* ---------- 20. Fine-tuning method ---------- */
mod({id:`ftm`,lvl:`Decisions 3`,title:`How we fine-tune: LoRA rank 32 in bf16, one epoch`,
body:`<b>Options.</b> <em>Full fine-tuning</em> updates all 24 billion weights: best in theory, but it needs the weights, gradients and optimizer state in memory, several times the model size, far beyond 128 GB. <em>LoRA</em> freezes the model and trains small low-rank adapters next to each weight matrix (module 7). <em>QLoRA</em> does the same on a 4-bit copy of the model: fits a 16 GB gaming GPU, but slower and slightly lossy. <em>Prompting only</em> (zero-shot) costs nothing but scored 33.8 hin→gbm, 10 points below any LoRA.<br><br><b>Our settings and why.</b> LoRA rank 32 in bf16 on the unified 128 GB DGX Spark, so no quantisation loss. Batch 4 × gradient accumulation 4 = 16 sequences per update. Sequences are <b>packed</b> to 1,024 tokens, so no compute is wasted on padding. One epoch: with a few million words, a second pass mostly memorises. Each run mixes two kinds of data: <b>continued pre-training</b> text (plain Garhwali, the model learns the language) and <b>supervised pairs</b> ("translate this Hindi into Garhwali: … → …", the model learns the task).<br><br><b>What training cost.</b> v4: 7.6 M tokens, 494 steps, 8.8 h. v5: 13.8 M tokens, 896 steps, about 15 h. The box is memory-bandwidth bound (273 GB/s), so steps are slower than on a data-centre GPU but the 128 GB lets a 24B model train in bf16 at all.`,
widget:`<table><tr><th>method</th><th>memory for 24B</th><th>quality</th><th>used?</th></tr><tr><td>full fine-tune</td><td>~4× model size and more</td><td>best in theory</td><td>no (does not fit)</td></tr><tr><td>LoRA bf16</td><td>model + small adapters</td><td>close to full</td><td><b>yes</b></td></tr><tr><td>QLoRA 4-bit</td><td>~¼ of model</td><td>slightly lower, slower</td><td>built for a 16 GB GPU, not used</td></tr><tr><td>zero-shot prompting</td><td>none</td><td>33.8 hin→gbm</td><td>baseline only</td></tr></table>`,
file:`scripts/train_lora.py: --r 32 --bs 4 --accum 4 --max_len 1024 --epochs 1 --sft_file --cpt_file (--qlora exists for small GPUs).`,
quiz:[[`Why pack sequences to 1,024 tokens?`,`so no compute is spent on padding`,`because the model can't read more`,`to make the loss lower`,0,`Many short sentences are concatenated into one full-length training example.`],[`Why only one epoch?`,`with little data, repeated passes mostly memorise it`,`the GPU overheats`,`LoRA only allows one`,0,`Overfitting risk grows with each pass over a small corpus.`]]});

/* ---------- 21. Data recipe ---------- */
mod({id:`recipe`,lvl:`Decisions 4`,title:`The data recipe from v1 to v6, and what each change taught`,
body:`Every version changed one main thing, so each score change tells a story. This is the most important lesson of the whole project: <b>data quality and variety beat volume</b>, and <b>synthetic data from a weaker model can make things worse</b>.<br><br>Two traps we fell into and fixed: (1) <em>back-translation</em> (module 14) sounded clever, but the 40,000 pairs were written by our own v2 model, so the Hindi/English side carried its mistakes, and every direction dropped. (2) <code>--max_cpt</code> in the training script keeps the <em>first</em> N records of the text file, not a random sample, so v5's corpus had to be shuffled or the new YouTube text would have been cut off.`,
widget:`<table><tr><th>version</th><th>main change</th><th>hin→gbm</th><th>eng→gbm</th><th>lesson</th></tr><tr><td>pilot (Qwen)</td><td>7.8 M tokens of web + literature</td><td class=n>43.5</td><td class=n>35.7</td><td>LoRA works: +10 over zero-shot</td></tr><tr><td>full (Qwen)</td><td>2.5× more of the same text</td><td class=n>43.6</td><td class=n>37.8</td><td>volume of one kind of text ≈ nothing</td></tr><tr><td>v2 (Qwen)</td><td>one spelling standard, both directions, radio bulletins</td><td class=n>43.3</td><td class=n>37.7</td><td>first reverse model: gbm→eng 58.9</td></tr><tr><td>Sarvam pilot</td><td>same data, better base</td><td class=n>44.3</td><td class=n>50.8</td><td>base model matters most</td></tr><tr><td>Sarvam v3</td><td>+40,000 back-translated pairs</td><td class=n>42.8</td><td class=n>47.1</td><td>synthetic pairs from a weaker model hurt</td></tr><tr><td>Sarvam v4</td><td>drop back-translation, add dictionaries</td><td class=n>43.6</td><td class=n>51.0</td><td>recovered; best eng→gbm</td></tr><tr><td>Sarvam v5</td><td>+632 K words YouTube speech, +480 K better bulletin text, shuffled</td><td class=n>…</td><td class=n>…</td><td>scoring overnight 30 Sept</td></tr><tr><td>Sarvam v6 (plan)</td><td>MADLAD web text, Open Bible Stories aligned pairs, Jambu, POS corpus</td><td class=n>…</td><td class=n>…</td><td>expect +1 to +3 into gbm</td></tr></table>`,
file:`scripts/build_data_v2.py, build_data_v4.py (v4/v5), build_corpus_v3.py; data/sft_train_v*.jsonl, data/cpt_train_v*.jsonl.`,
quiz:[[`v3 added 40,000 back-translated pairs and every direction dropped. The most likely reason:`,`the pairs were produced by a weaker model and carried its errors`,`40,000 is too few`,`the learning rate changed`,0,`Synthetic data inherits the generator's mistakes.`],[`A training script keeps the first N records of a file. What must you do before capping N?`,`shuffle the file`,`sort it by length`,`nothing`,0,`Otherwise whatever happens to be at the end is silently dropped.`]]});

/* ---------- 22. Evaluation ---------- */
mod({id:`evalx`,lvl:`Decisions 5`,title:`Evaluation you can trust`,
body:`A number is only useful if it cannot fool you. The rules we follow:<br><br><b>1. A test set that is never trained on.</b> The 1,012 FLORES Garhwali test sentences, professionally translated, were held out on day one. When we built the word language model we removed 297 lines of our corpus that overlapped the Vaani test transcripts, a <em>leak guard</em>.<br><b>2. Tune on one part, report on another.</b> The language-model weights (alpha, beta) were tuned on 150 test clips and the score is reported on the other 300. Tuning and reporting on the same data inflates results: SraVaani + LM looked like 0.382 on the tuning clips and was 0.444 on the held-out ones.<br><b>3. Same split, same normaliser, before comparing.</b> One public report gives SraVaani 42.8% WER, a paper gives w2v-BERT 47.0%, we get 44.0%: three different splits and text normalisers, so none of these can be ranked until measured on the same data. We re-scored SraVaani on our own test set before drawing conclusions.<br><b>4. chrF++ over BLEU for Garhwali.</b> BLEU counts whole-word matches and punishes spelling variants harshly; chrF++ scores character n-grams plus word pairs, which is fairer for a language without one standard spelling.<br><b>5. Check outputs, not inputs.</b> Every generated artefact gets scored on what it actually contains (module 27).`,
widget:`<table><tr><th>claim</th><th>their number</th><th>comparable to ours?</th></tr><tr><td>vineetkukreti hi↔gbm mT5 v4</td><td class=n>chrF++ 83.9</td><td>no: own in-house test, partly synthetic</td></tr><tr><td>SraVaani base (public notes)</td><td class=n>WER 42.8</td><td>no: 269-row validation split</td></tr><tr><td>SraVaani, measured by us</td><td class=n>WER 44.2 / 46.1</td><td><b>yes</b>: our 450 / held-out 300</td></tr><tr><td>w2v-BERT (2026 paper)</td><td class=n>WER 47.0</td><td>close: official Vaani split, no LM</td></tr></table>`,
file:`eval/flores_test.jsonl (held out forever); scripts/eval_translate.py; scripts/asr_lm_decode.py (tune 150 / report 300); scripts/build_asr_lm.py (leak guard).`,
quiz:[[`A decoder is tuned and scored on the same 150 clips. The score is probably`,`too optimistic`,`too pessimistic`,`exactly right`,0,`SraVaani+LM: 0.382 on tuning clips, 0.444 held-out.`],[`Two papers report WER 42 and 47 on Garhwali. Which model is better?`,`unknown until both are measured on the same split and normaliser`,`the 42 one`,`the 47 one`,0,`Different test sets answer different questions.`]]});

/* ---------- 23. ASR bases ---------- */
mod({id:`asrb`,lvl:`Decisions 6`,title:`Speech recognition: every base model we tried`,
body:`<b>Options.</b> Meta's MMS-1B (a Garhwali adapter exists), Whisper (weak on Garhwali in every paper: 62-66% WER), w2v-BERT 2.0 (strongest in a 2026 paper, 47.0%), and SraVaani-1.0 from ARTPARK-IISc (430M, trained on 31,000 h of Vaani across 65 languages).<br><br><b>Our path.</b> The untouched MMS adapter got 0.746. Training only the adapter plateaued at 0.711; unfreezing the whole encoder (round 2) dropped it to 0.513, the biggest step. Pseudo-labels then gave about one point per round (module 25). Adding the word language model to decoding gave 7.6 points (module 24).<br><br><b>SraVaani</b>, tested on our exact test set without any training, beats our fine-tuned MMS on plain decoding: 0.442 against 0.493. With our language model the two tie (0.444 vs 0.440), because SraVaani outputs sub-word pieces that gain less from a word model, and it ships as a frozen TorchScript file we cannot fine-tune. <b>Decision:</b> keep MMS r5 + LM today; SraVaani is the future base as soon as a trainable checkpoint is available.`,
widget:`<table><tr><th>model</th><th>Vaani test WER</th><th>notes</th></tr><tr><td>MMS adapter, untouched</td><td class=n>0.746</td><td>baseline</td></tr><tr><td>MMS adapter-only fine-tune (r1)</td><td class=n>0.711</td><td>plateaued</td></tr><tr><td>MMS full encoder (r2)</td><td class=n>0.513</td><td>7,049 human-labelled clips</td></tr><tr><td>+10 K pseudo-labels (r3)</td><td class=n>0.503</td><td></td></tr><tr><td>+44 K agreed pseudo-labels (r5)</td><td class=n>0.493</td><td>greedy, all 450</td></tr><tr><td>SraVaani-1.0 zero-shot</td><td class=n>0.442</td><td>greedy, all 450</td></tr><tr><td><b>MMS r5 + word LM</b></td><td class=n><b>0.440</b></td><td>held-out 300: current best</td></tr><tr><td>SraVaani + word LM</td><td class=n>0.444</td><td>held-out 300</td></tr></table>`,
file:`scripts/asr_finetune.py; runs/asr-mms-gbm-r*/log.tsv; scripts/eval_sravaani.py, scripts/sravaani_lm.py.`,
quiz:[[`Which single change helped MMS the most?`,`unfreezing the whole encoder instead of only the adapter`,`adding pseudo-labels`,`a larger batch size`,0,`0.711 → 0.513.`],[`SraVaani is better zero-shot but was not adopted because`,`with our word LM it only ties, and it cannot be fine-tuned yet`,`it is closed source`,`it does not support Garhwali`,0,`It is MIT-licensed and does cover Garhwali; the frozen format is the blocker.`]]});

/* ---------- 24. Word LM ---------- */
mod({id:`wlm`,lvl:`Decisions 7`,title:`A word language model inside the decoder: the biggest ASR win`,
body:`A CTC model (module 9) predicts one letter per audio frame and knows nothing about which <em>words</em> exist. Plain ("greedy") decoding takes the most likely letter at each frame, so near-misses like "बिजलि" vs "बिजली" or split words slip through. <b>Beam search with a language model</b> keeps several candidate transcripts and prefers those whose words are likely Garhwali.<br><br>We built a word 3-gram model with <b>interpolated Kneser-Ney smoothing</b> from 2.27 M words of clean text. KenLM's builder needs the Boost library, which isn't on the box, so we wrote the ARPA file in Python. It excludes the ASR bulletin text (it would teach the recogniser its own mistakes) and any line overlapping the test set. The decoder (pyctcdecode) mixes the acoustic score with alpha × LM score + beta × word count; alpha and beta were tuned on 150 clips.<br><br><b>Result:</b> held-out WER 0.511 → 0.434, −7.6 points, from a text file and no new audio. For comparison, 44,000 extra machine-labelled clips bought −0.3 points. It also runs in a separate Python environment, because the decoder package once downgraded numpy and broke training.`,
widget:`<table><tr><th>change</th><th>held-out WER gain</th><th>cost</th></tr><tr><td>+44,000 pseudo-labelled clips (r5)</td><td class=n>−0.3</td><td>5.5 h GPU + 2.8 h relabel</td></tr><tr><td>word 3-gram LM in the decoder</td><td class=n>−7.6</td><td>34 s to build, CPU decoding</td></tr><tr><td>same LM on SraVaani (sub-word model)</td><td class=n>−1.7</td><td>own beam search</td></tr></table>`,
file:`scripts/build_asr_lm.py → lm/gbm_3gram.arpa; scripts/asr_lm_decode.py (tuning); scripts/asr_lm_transcribe.py (bulk); .venv-lm.`,
quiz:[[`Why does a word LM help a CTC model so much?`,`CTC predicts letters and has no idea which words are real`,`it makes the audio louder`,`it adds more training data`,0,`The LM adds word knowledge the acoustic model lacks.`],[`Why exclude ASR-transcribed text from the LM?`,`it would reinforce the recogniser's own errors`,`it is too long`,`it is in Hindi`,0,`Train the LM on text people actually wrote.`]]});

/* ---------- 25. Pseudo-label ceiling ---------- */
mod({id:`plc`,lvl:`Decisions 8`,title:`Why machine labels stopped helping`,
body:`Self-training lets a model label unlabelled audio and learn from its own confident guesses. We tried it twice with increasing care. Round 3 kept the 10,000 most confident of 110,410 labels: −1 point. Round 5 relabelled everything with the better model and kept only clips where two models agreed within 5% of characters and confidence was at least 0.85, 44,159 clips: another −1 point.<br><br>The ceiling is simple: a teacher that gets about half the words wrong teaches its mistakes along with its knowledge, and agreement between two related models filters noise but not shared errors ("तरियावरण" for "पर्यावरण" passed both). <b>What moves speech recognition now:</b> human-corrected clips (the review page), a better language model, or a stronger base (SraVaani).`,
widget:`<table><tr><th>round</th><th>labels added</th><th>filter</th><th>WER</th></tr><tr><td>r2</td><td>0 (7,049 human)</td><td>–</td><td class=n>0.513</td></tr><tr><td>r3</td><td>10,000</td><td>confidence ≥ 0.9</td><td class=n>0.503</td></tr><tr><td>r5</td><td>44,159</td><td>2-model agreement (CER ≤ 0.05) + confidence ≥ 0.85</td><td class=n>0.493</td></tr></table>`,
file:`scripts/pseudo_agree.py; audio/vaani_pseudo_r5.jsonl; runs/asr-mms-gbm-r5.`,
quiz:[[`Two models agree on a transcript. Is it correct?`,`not necessarily: related models can share the same mistake`,`yes, always`,`only if both are confident`,0,`Agreement removes random noise, not shared bias.`]]});

/* ---------- 26. YouTube harvest ---------- */
mod({id:`yt`,lvl:`Decisions 9`,title:`Harvesting 463 hours of Garhwali YouTube, safely`,
body:`Our translation data was mostly Bible, news and blogs: formal. Everyday spoken Garhwali lives on YouTube. The process, each step checked before the next:<br><b>1. Search</b> 20 queries (comedy, vlog, interview, natak…), keep 3-60 minute videos, drop titles that look like music, news or Kumaoni: 511 videos from 221 channels.<br><b>2. Pilot</b> 28 videos from the 15 biggest channels, transcribe, and measure what share of each channel's speech a language identifier calls Garhwali. The best seven were 80-92% Garhwali; one channel failed.<br><b>3. Expand</b> to the full upload lists of the seven good channels: 2,193 videos, 463 h, about 5 h of download.<br><b>4. Transcribe</b> with ASR r5 + the word LM: 250,870 segments; keep confident, Garhwali-identified, de-duplicated ones: 96,778 segments, 1.15 M words.<br><b>5. Spot-check and filter again</b> before training: the text is real conversational Garhwali but noisy at low confidence, so v5 keeps only confidence ≥ 0.88 and joins each video's segments into ~110-word paragraphs: 632 K words, 19% of corpus v3.`,
widget:`<table><tr><th>stage</th><th>count</th></tr><tr><td>videos in manifest</td><td class=n>2,193</td></tr><tr><td>downloaded</td><td class=n>2,037</td></tr><tr><td>ASR segments</td><td class=n>250,870</td></tr><tr><td>kept after confidence + language + dedup</td><td class=n>96,778 (1.15 M words)</td></tr><tr><td>used in v5 (confidence ≥ 0.88, paragraphs)</td><td class=n>632 K words</td></tr></table>`,
file:`audio/manifests/youtube_all.tsv; scripts/yt_channel_qa.py; scripts/filter_asr_text.py; scripts/build_corpus_v3.py.`,
quiz:[[`Why run a 30-video pilot before downloading 2,193 videos?`,`to measure per channel whether the speech is really Garhwali`,`to test the internet speed`,`YouTube requires it`,0,`Check a real sample before paying for the bulk.`]]});

/* ---------- 27. Failures ---------- */
mod({id:`fails`,lvl:`Decisions 10`,title:`Failures that cost hours, and the guardrail each one left`,
body:`Every item here cost real time. Interviewers ask about exactly this, because it shows you debug systems, not just train models. The rule that came out of all of them: <b>before any batch job, run one to three real items end to end and look at the output; and make every job score its own output and refuse empty results.</b>`,
widget:`<table><tr><th>what broke</th><th>cost</th><th>root cause</th><th>guardrail</th></tr><tr><td>OCR returned blank pages</td><td>6 GPU-hours</td><td>the vision model "thinks" even when told not to and spent its token budget; only the API was tested, never a real page</td><td>Tesseract + confidence masking; test real pages first</td></tr><tr><td>OCR crashed on page 1</td><td>1 queue slot</td><td>a base64 image passed as a command-line argument exceeded the OS limit</td><td>send request bodies on stdin</td></tr><tr><td>killed job marked "done"</td><td>a training run on partial data</td><td>controller checked files exist, not exit code</td><td>require exit code 0 and outputs</td></tr><tr><td>journal invented numbers</td><td>trust</td><td>an LLM summarised logs freely</td><td>reject notes with numbers not in the log</td></tr><tr><td>v5 could have dropped new data</td><td>caught in time</td><td>--max_cpt keeps the first N records</td><td>shuffle the corpus</td></tr><tr><td>narrator audio cut 3.6 s short</td><td>one render</td><td>audio sidechain ends with its shortest input</td><td>anchor to an exact-length silent track; assert lengths</td></tr></table>`,
file:`scripts/controller.py; scripts/ocr_book.py; scripts/journal_note.py; ~/downline/PIPELINE_BIBLE.md.`,
quiz:[[`A batch job's API call succeeds with a fake model name. What have you verified?`,`only that the request reaches the server, not that outputs are usable`,`that the job will work`,`that the model is loaded`,0,`Test one real item and read its output.`]]});

/* ---------- 28. Landscape ---------- */
mod({id:`land`,lvl:`The landscape`,title:`Who else works on Garhwali, and where we stand`,
body:`Knowing the field is part of the job: it tells you whether your result is new, and what to compare against. A full sweep on 30 Sept 2026 found:<br><br><b>Translation: nothing public beats our FLORES numbers.</b> The public Hindi↔Garhwali models are small mT5 models trained on template or synthetic sentences and scored on their own test sets; pahadi.ai is a closed app launched with Uttarakhand government backing; big labs (Sarvam, AI4Bharat, Google, Meta NLLB) don't cover Garhwali translation. <b>Speech: real competition.</b> SraVaani (ARTPARK-IISc) and a 2026 w2v-BERT paper are within a few points of us, and SraVaani beats our base model without a language model.<br><br><b>Why ours is ahead on translation:</b> the best base model for the direction (Sarvam into Garhwali), bidirectional training, a consistent spelling standard, 3.4 M words of real text including speech transcripts, and honest evaluation on a professional held-out test set that anyone can reproduce.`,
widget:`<table><tr><th>project</th><th>what</th><th>open?</th><th>how it compares</th></tr><tr><td>vineetkukreti/garhwali-hindi-mt v2-v4</td><td>mT5-small hi↔gbm</td><td>weights (v4 private), no data</td><td>in-house test only, synthetic templates</td></tr><tr><td>pahadi.ai</td><td>chat + voice app</td><td>closed</td><td>unknown model</td></tr><tr><td>somu9/gbm-tokenizer</td><td>128K tokenizer</td><td>gated, corpus unreleased</td><td>worse than Gemma 3 on its own eval</td></tr><tr><td>rushilrawat Language Lab</td><td>data + benchmarks, mT0</td><td>yes</td><td>mT0 chrF 23.8 on FLORES dev</td></tr><tr><td>SraVaani-1.0 (ARTPARK-IISc)</td><td>ASR, 65 languages</td><td>MIT, gated</td><td>0.442 zero-shot on our test; our base is 0.493</td></tr><tr><td>w2v-BERT paper (2026)</td><td>ASR benchmark</td><td>numbers only</td><td>0.470 greedy, official split</td></tr><tr><td><b>this project</b></td><td>MT both ways + ASR + TTS demo</td><td>not yet released</td><td>MT best public on FLORES; ASR 0.440 with LM</td></tr></table>`,
file:`~/garhwali/RESEARCH.md (addendum 2026-09-30).`,
quiz:[[`Before claiming state of the art you should`,`measure the competitor on your own test set and normaliser`,`quote the competitor's paper number`,`skip it`,0,`That's why we re-scored SraVaani ourselves.`]]});

/* ---------- 29. Serving ---------- */
mod({id:`serve`,lvl:`Serving`,title:`Putting it in people's hands`,
body:`A model on a disk helps nobody. The demo chains three models: speech recognition (MMS r5) → translation (Qwen v2) → speech synthesis (MMS-TTS for Garhwali, Kokoro for English), about 10-15 s per turn and 43 GB of memory. Lessons from getting it onto a phone in India:<br>• <b>Browsers only allow the microphone on HTTPS pages</b> (or localhost), so a plain LAN address loads but cannot record.<br>• <b>Tailscale Serve</b> gives a private HTTPS address inside your tailnet; <b>Funnel</b> makes it public. We chose Funnel for no-install access, knowing the link has no password.<br>• <b>Links opened inside WhatsApp</b> use its built-in browser, which blocks the mic; the page now detects this and explains what to do, offers an upload fallback, and reports errors back to the server so failures on someone else's phone are visible.<br>• Serving and training compete for the same memory: the demo had to stop while the 24B model trained.<br><b>Next:</b> quantise the models (4-8 bit) and keep them loaded to roughly halve the latency and memory.`,
widget:`<table><tr><th>step</th><th>model</th><th>time</th></tr><tr><td>hear Garhwali</td><td>MMS-1B r5</td><td class=n>~1 s</td></tr><tr><td>translate</td><td>Qwen3-8B + v2 adapter</td><td class=n>~5-8 s</td></tr><tr><td>speak</td><td>MMS-TTS / Kokoro</td><td class=n>~1-3 s</td></tr></table>`,
file:`scripts/demo_server.py; demo/index.html; tailscale funnel --bg 8792.`,
quiz:[[`A page loads over http:// but the mic never asks for permission. Why?`,`browsers only expose the microphone on secure (https) pages`,`the mic is broken`,`the server is down`,0,`getUserMedia requires a secure context.`]]});

/* ---------- 30. Roadmap ---------- */
mod({id:`road`,lvl:`Roadmap`,title:`What to improve next, in order of expected gain`,
body:`Ordered by what the evidence says moves the score, not by what is fun to build.`,

/* ---------- 31. Career ---------- */
mod({id:`career`,lvl:`Career`,title:`From this project to an AI engineer job`,
body:`You have built, end to end, what AI engineering teams do: data collection and cleaning, fine-tuning large models, evaluation, speech systems, inference and serving, and an automated pipeline, all on your own hardware. Turn it into evidence.<br><br><b>Portfolio:</b> (1) publish the models with honest model cards and the FLORES scores; (2) write one long post: "Building open Garhwali translation and speech on a single DGX Spark" with the tables from this page; (3) put the pipeline code on GitHub with a README that shows one command per stage.<br><br><b>Interview stories</b> (situation → what you did → result): the back-translation regression (diagnosed synthetic data hurting all four directions, recovered 1-4 points); the language-model decoder (−7.6 WER from a text file, no new audio); the OCR incident (lost 6 h to an untested batch, built output-checking guardrails); the self-running controller and its failures; the SraVaani comparison (why you re-measured a competitor on your own split).<br><br><b>Study in this order</b>, each tied to a module here: PyTorch training loop (1-3) → tokenisation and transformers (4-5, 18) → fine-tuning, LoRA, mixed precision (7, 20) → evaluation and experiment design (8, 21-22) → speech: CTC, beam search, n-gram LMs (9, 24) → inference: memory bandwidth, quantisation, batching, serving (6, 29) → MLOps: queues, checks, reproducibility (17, 27). Your notes say inference engineering is your spine: go deepest on module 6 and 29 topics (vLLM, quantisation, KV cache, throughput vs latency).<br><br><b>Papers to read</b>: LoRA (Hu et al. 2021), CTC (Graves 2006), Kneser-Ney smoothing (Chen & Goodman 1998), chrF (Popović 2015), MMS (Pratap et al. 2023), NLLB (2022), IndicGenBench (2024), the SraVaani paper (2026).`,
widget:`<table><tr><th>job skill</th><th>where you did it</th></tr><tr><td>data engineering</td><td>27-source census, OCR, YouTube harvest, spelling standard</td></tr><tr><td>LLM fine-tuning</td><td>Qwen3-8B and Sarvam-M 24B LoRA, v1-v6</td></tr><tr><td>evaluation</td><td>held-out FLORES, chrF++, WER, leak guards, tune/report splits</td></tr><tr><td>speech ML</td><td>MMS fine-tuning, pseudo-labels, KenLM decoding, SraVaani</td></tr><tr><td>inference / serving</td><td>live demo, HTTPS + Funnel, memory planning on 128 GB unified</td></tr><tr><td>MLOps</td><td>cron controller, job queue, dashboards, guardrails</td></tr></table>`,
file:`everything above; start with the dashboard: https://aptsalt.github.io/garhwali-review/dashboard/`,
quiz:[[`In an interview, which story best shows engineering judgement?`,`the back-translation regression: a clever idea that measurably hurt, found and reverted`,`listing every library used`,`the size of the GPU`,0,`Show how you decide with evidence.`]]});

/* ---------- render ---------- */
